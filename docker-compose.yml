version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Cross-Platform for Windows, Linux, and macOS)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lifedrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifedrop_user
      POSTGRES_PASSWORD: lifedrop_secure_pass_2026
      POSTGRES_DB: lifedrop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifedrop_user -d lifedrop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

