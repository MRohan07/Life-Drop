
# Render Blueprint Infrastructure as Code for LifeDrop
# PostgreSQL + Express Backend + React Frontend

version: "1"

services:

  # --------------------------------------------------
  # 1. BACKEND - Express Node.js API
  # --------------------------------------------------
  - type: web
    name: lifedrop-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon

    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: lifedrop-db
          property: connectionString

      - key: FRONTEND_URL
        sync: false

      - key: CORS_ORIGINS
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m

      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: "7"

      - key: ADMIN_PASSKEY_PIN
        sync: false

      - key: SMS_PROVIDER
        value: mock

      - key: LOG_LEVEL
        value: info


  # --------------------------------------------------
  # 2. FRONTEND - React Static Site
  # --------------------------------------------------
  - type: web
    name: lifedrop-frontend
    runtime: static
    rootDir: .

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: VITE_API_BASE_URL
        value: https://lifedrop-api-pi7t.onrender.com/api/v1

    routes:
      - type: rewrite
        source: /*
        destination: /index.html


# --------------------------------------------------
# 3. DATABASE - PostgreSQL
# --------------------------------------------------
databases:
  - name: lifedrop-db
    databaseName: lifedrop
    user: lifedrop_user
    plan: free
    region: oregon
    ipAllowList: []
